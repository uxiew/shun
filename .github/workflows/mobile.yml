name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 终端原生库 libghostty 按 pubspec.yaml 的 hooks 设定从源码编，要 Zig 0.16，大小版本号都得对上
      # （见 third_party/README.md）。不装的话 flutter test 和各个 build 在编原生库那一步就失败。
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          APP_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          APP_VERSION="${APP_VERSION%%+*}"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid pubspec version: $APP_VERSION" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # packages/plugin_api 是单独的 Dart 包，测试用的 package:test 只写在它自己的 pubspec 里，
      # 根目录的 pub get 不会替它解析。不先进去 pub get，下面的 flutter analyze 会对它的两个测试文件
      # 报 183 条「Target of URI doesn't exist: 'package:test/test.dart'」，CI 直接红。
      # 本机不报是因为以前手动 pub get 过，留着被 gitignore 的 .dart_tool。
      - run: dart pub get
        working-directory: packages/plugin_api
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Restore persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Persistent Android signing secrets are not configured" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/shun-release.jks
      - name: Build Android release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/shun-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: shun
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # 只打 arm64：只有它在设备上测过（REL03），和 tool/build-release.sh、使用手册一致。
        # android/app/build.gradle.kts 把其他架构的原生库从发布包里排掉了，以前这里 --split-per-abi
        # 打出的 armeabi-v7a、x86_64 包各 2.2 MB、一个 .so 都没有，能装上，一打开就崩。
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-number=${{ github.run_number }} \
            --dart-define=GITHUB_OAUTH_CLIENT_ID=Ov23lidR2u8OIkHW19nk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/shun-v${{ steps.app_version.outputs.version }}-android-arm64-v8a.apk"
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: shun-v${{ steps.app_version.outputs.version }}-android-apks-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # 同上：iOS 包里的终端原生库也要 Zig 0.16 从源码编。
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          APP_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          APP_VERSION="${APP_VERSION%%+*}"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid pubspec version: $APP_VERSION" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS release app
        run: flutter build ios --release --no-codesign --dart-define=GITHUB_OAUTH_CLIENT_ID=Ov23lidR2u8OIkHW19nk
      - name: Package re-signable IPA
        shell: bash
        run: |
          PACKAGE="shun-v${{ steps.app_version.outputs.version }}-ios-unsigned.ipa"
          mkdir -p dist build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Payload "../../../dist/$PACKAGE"
      - name: Upload re-signable IPA
        uses: actions/upload-artifact@v4
        with:
          name: shun-v${{ steps.app_version.outputs.version }}-ios-unsigned-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
