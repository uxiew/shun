name: netcatty_mobile
description: Netcatty mobile SSH, SFTP and cloud-sync client for Android and iOS.
publish_to: none
version: 1.4.7+26

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartssh2: ^2.22.3
  xterm2: 5.2.0
  # Ghostty 终端引擎：自己维护的 fork（上游 main + 我们的补丁），说明见 third_party/README.md。
  flterm:
    path: third_party/libghostty/packages/flterm
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  cryptography: ^2.7.0
  aws_common: ^0.7.12
  aws_signature_v4: ^0.6.13
  http: ^1.4.0
  uuid: ^4.5.1
  file_picker: ^10.2.0
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  share_plus: ^11.0.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.0
  highlight: ^0.7.0
  plugin_api:
    path: packages/plugin_api

dependency_overrides:
  # flterm 声明的是 pub 上的 libghostty ^0.0.12，不 override 会拉 pub 上的旧版，和 fork 的 flterm 对不上。
  libghostty:
    path: third_party/libghostty/packages/libghostty

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # X03 会话状态机测试要控制时间（关闭确认的 2 秒窗口）。已是 flutter_test 的传递依赖，锁定版本不变。
  fake_async: 1.3.3
  # X03 在模拟器上驱动真实的插件桥和测试插件 APK（integration_test/）。
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/distro/
    - assets/docker/

hooks:
  user_defines:
    libghostty:
      # 原生库必须从源码编（要 Zig 0.16，../.toolchain/env.sh 已带上）。不设就按版本号 0.0.12 下载上游
      # 预编译库，那是旧 Ghostty 源码编的，新绑定调它会在创建终端时报
      # "Invalid value provided. (operation: ghostty_terminal_new, code: -2)"。
      source: compile
