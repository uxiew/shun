# 真的 tailscaled（v1.102.5）+ Headscale 0.29.4 控制面，给 R14 的 Tailscale SSH 验证用。不是 Tailscale 的服务。
#
#   本机 ──127.0.0.1:21055──> ts-socks（userspace tailscaled，SOCKS5，扮演 TailSocks，登录为用户 fixture）
#                                 │ tailnet（容器网络 tsnet，没有外网）
#                                 └──> ts-server 100.64.x.x：22 = Tailscale SSH，2222 = 普通 OpenSSH
#   headscale 只在 tsnet 里，外面访问不到。
#
#   R15（`./up.sh routes` 才起，compose profile `routes`）：同一台 ts-server 的另外两条路
#   本机 ──127.0.0.1:21056──> ts-relay（tag:relay，共享的远程 SOCKS，dante 要用户名密码）──tailnet──> ts-server
#   本机 ──127.0.0.1:22202──> ts-jump（用户 fixture 自己的跳板机，OpenSSH）──tailnet──> ts-server
#   这两台是内核模式 tailscaled（要 NET_ADMIN 和 /dev/net/tun），见 node-entry.sh。
name: xwshun-tailscale-ssh

x-ts: &ts
  environment: &tsenv
    TS_USERSPACE: "true"
    TS_STATE_DIR: /var/lib/tailscale
    # 不往 log.tailscale.com 上报日志
    TS_TAILSCALED_EXTRA_ARGS: "--no-logs-no-support"
    TS_AUTH_ONCE: "true"
  # 万一哪里还想连 Tailscale 官方服务，名字直接解析到回环
  extra_hosts:
    - "log.tailscale.com:127.0.0.1"
    - "log.tailscale.io:127.0.0.1"
    - "controlplane.tailscale.com:127.0.0.1"
    - "login.tailscale.com:127.0.0.1"
    - "pkgs.tailscale.com:127.0.0.1"

services:
  headscale:
    image: headscale/headscale:0.29.4@sha256:8833f828b414c0907b7e5c71da76473216fe17cce0818a166b536ec552c0903f
    command: ["serve"]
    volumes:
      - ./config.yaml:/etc/headscale/config.yaml:ro
      - ./policy.hujson:/etc/headscale/policy.hujson:ro
      - ./derp.yaml:/etc/headscale/derp.yaml:ro
    networks: [tsnet]

  ts-server:
    <<: *ts
    build:
      context: .
      dockerfile: Dockerfile.server
    image: xwshun-ts-server:1.102.5
    hostname: ts-server
    environment:
      <<: *tsenv
      TS_AUTHKEY: ${SERVER_AUTHKEY}
      TS_HOSTNAME: ts-server
      TS_EXTRA_ARGS: "--login-server=http://headscale:8080 --ssh"
      ORDINARY_PASSWORD: ${ORDINARY_PASSWORD}
      KEEPALIVE_PEERS: ts-socks ts-relay ts-jump
    networks: [tsnet]

  ts-socks:
    <<: *ts
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    hostname: ts-socks
    # 没有可用的 DERP 中继：空闲一会儿后直连路径会失效，下一次经 SOCKS 拨号直接报 SOCKS 一般错误（状态码 1）。
    # 保温见 keepalive.sh（官方镜像不改，挂进去）。
    # 先丢掉内核发往 tailnet 网段的包：userspace 模式下 tailnet 流量都在 tailscaled 自己的网络栈里，
    # 能走到内核的 100.x 只可能是不在这个假 tailnet 里的地址；开发机自己在真实 tailnet 上时，
    # 它们会经 OrbStack 落进真实 tailnet（见 node-entry.sh）。
    cap_add: [NET_ADMIN]
    entrypoint:
      - sh
      - -c
      - |
        iptables -A OUTPUT -d 100.64.0.0/10 -j DROP
        ip6tables -A OUTPUT -d fd7a:115c:a1e0::/48 -j DROP
        /keepalive.sh &
        exec /usr/local/bin/containerboot
    environment:
      <<: *tsenv
      TS_AUTHKEY: ${SOCKS_AUTHKEY}
      TS_HOSTNAME: ts-socks
      TS_EXTRA_ARGS: "--login-server=http://headscale:8080"
      TS_SOCKS5_SERVER: ":1055"
      KEEPALIVE_PEERS: ts-server ts-jump
    volumes: ["./keepalive.sh:/keepalive.sh:ro"]
    networks: [tsnet, edge]
    ports: ["127.0.0.1:21055:1055"]

  ts-relay:
    <<: *ts
    profiles: [routes]
    build: &node
      context: .
      dockerfile: Dockerfile.node
    image: xwshun-ts-node:1.102.5
    hostname: ts-relay
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      <<: *tsenv
      TS_USERSPACE: "false"
      ROLE: relay
      TS_AUTHKEY: ${RELAY_AUTHKEY}
      TS_HOSTNAME: ts-relay
      # 不让 tailscaled 改容器里的 iptables：出网隔离规则是 node-entry.sh 自己加的，别被它的链打乱。
      TS_EXTRA_ARGS: "--login-server=http://headscale:8080 --netfilter-mode=off"
      RELAY_PASSWORD: ${RELAY_PASSWORD}
      KEEPALIVE_PEERS: ts-server
    networks: [tsnet, edge-relay]
    ports: ["127.0.0.1:21056:1080"]

  ts-jump:
    <<: *ts
    profiles: [routes]
    build: *node
    image: xwshun-ts-node:1.102.5
    hostname: ts-jump
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      <<: *tsenv
      TS_USERSPACE: "false"
      ROLE: jump
      TS_AUTHKEY: ${JUMP_AUTHKEY}
      TS_HOSTNAME: ts-jump
      TS_EXTRA_ARGS: "--login-server=http://headscale:8080 --netfilter-mode=off"
      JUMP_PASSWORD: ${JUMP_PASSWORD}
      KEEPALIVE_PEERS: ts-server ts-socks
    networks: [tsnet, edge-jump]
    ports: ["127.0.0.1:22202:22"]

networks:
  tsnet:
    internal: true
  # 每个要映射端口的节点各用一张 edge：两台节点同时在 tsnet 和同一张 edge 上时，disco 会在两条路径间来回切，
  # 实测「经 ts-socks 到 ts-jump」时不时第一次连接被断开。分开后节点之间只剩 tsnet 一条路。
  edge: {}
  edge-relay: {}
  edge-jump: {}
